name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.txt
      - run: python -m py_compile server.py database.py planning_rules.py scripts/*.py
      - run: python -m unittest discover -s tests
      - run: git diff --check
      - name: Check for committed secrets
        run: |
          ! git grep -nEI '(postgres(ql)?://[^C]|BEGIN (RSA|OPENSSH) PRIVATE KEY|AWS_SECRET_ACCESS_KEY)' -- ':!.env.example'
